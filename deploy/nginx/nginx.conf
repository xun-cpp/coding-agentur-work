user nginx;
worker_processes auto;
worker_rlimit_nofile 8192;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
    multi_accept off;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format security escape=json '{"time":"$time_iso8601","request_id":"$request_id","client":"$remote_addr","method":"$request_method","host":"$host","uri":"$uri","protocol":"$server_protocol","status":$status,"bytes":$body_bytes_sent,"duration":$request_time,"referer":"$http_referer","user_agent":"$http_user_agent","cf_ray":"$http_cf_ray"}';
    access_log /var/log/nginx/access.log security buffer=32k flush=5s;

    server_tokens off;
    autoindex off;
    ignore_invalid_headers on;
    underscores_in_headers off;
    merge_slashes on;
    reset_timedout_connection on;

    client_max_body_size 16k;
    client_body_buffer_size 16k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;
    keepalive_timeout 15s;
    keepalive_requests 100;
    send_timeout 15s;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json application/xml application/manifest+json image/svg+xml;

    limit_req_status 429;
    limit_conn_status 429;
    limit_conn_zone $binary_remote_addr zone=ca_connections:10m;
    limit_req_zone $binary_remote_addr zone=ca_global:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=ca_api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=ca_contact:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=ca_login:10m rate=5r/m;

    include /etc/nginx/conf.d/*.conf;
    include /etc/nginx/sites-enabled/*;
}
