server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;
    ssl_reject_handshake on;
}

server {
    listen 80;
    listen [::]:80;
    server_name reference.example.invalid www.reference.example.invalid;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        limit_except GET { deny all; }
        try_files $uri =404;
    }

    location / {
        return 308 https://reference.example.invalid$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.reference.example.invalid;

    ssl_certificate /etc/letsencrypt/live/reference.example.invalid/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/reference.example.invalid/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:CA_SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    return 308 https://reference.example.invalid$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name reference.example.invalid;

    ssl_certificate /etc/letsencrypt/live/reference.example.invalid/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/reference.example.invalid/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:CA_SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /var/www/reference-application/current;
    index index.html;
    disable_symlinks if_not_owner from=$document_root;
    sub_filter_once off;
    sub_filter '__CSP_NONCE__' $request_id;

    limit_conn ca_connections 20;
    limit_req zone=ca_global burst=60 nodelay;

    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache, no-store, no-transform, must-revalidate" always;

    location = /api/v1/inquiries {
        limit_except POST OPTIONS { deny all; }
        limit_req zone=ca_contact burst=3 nodelay;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/proxy-api.conf;
    }

    location = /api/v1/auth/login {
        limit_except POST OPTIONS { deny all; }
        limit_req zone=ca_login burst=3 nodelay;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/proxy-api.conf;
    }

    location = /api/v1/auth/logout {
        limit_except POST OPTIONS { deny all; }
        limit_req zone=ca_api burst=10 nodelay;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/proxy-api.conf;
    }

    location = /api/v1/auth/me {
        limit_except GET OPTIONS { deny all; }
        limit_req zone=ca_api burst=10 nodelay;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/proxy-api.conf;
    }

    location ^~ /api/ {
        limit_except GET POST OPTIONS { deny all; }
        limit_req zone=ca_api burst=10 nodelay;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/snippets/proxy-api.conf;
    }

    location ^~ /_astro/ {
        limit_except GET HEAD { deny all; }
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    location = /.well-known/security.txt {
        limit_except GET HEAD { deny all; }
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=3600" always;
        default_type text/plain;
        try_files $uri =404;
    }

    location ~* \.(?:jpg|jpeg|png|webp|avif|svg|ico|woff2)$ {
        limit_except GET HEAD { deny all; }
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400" always;
        try_files $uri =404;
    }

    location ~ (^|/)\. {
        return 404;
    }

    location ~* \.(?:bak|conf|crt|env|ini|key|lock|log|map|old|orig|pem|save|sql|swp|toml|ya?ml)$ {
        return 404;
    }

    location ~* /(?:package(?:-lock)?\.json|tsconfig\.json|dockerfile|compose\.ya?ml)$ {
        return 404;
    }

    location / {
        limit_except GET HEAD { deny all; }
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, no-transform, must-revalidate" always;
    }
}
