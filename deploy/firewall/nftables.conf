#!/usr/sbin/nft -f

flush ruleset

table inet filter {
    set cloudflare_v4 {
        type ipv4_addr
        flags interval
        elements = { 173.245.48.0/20, 103.21.244.0/22, 103.22.200.0/22, 103.31.4.0/22, 141.101.64.0/18, 108.162.192.0/18, 190.93.240.0/20, 188.114.96.0/20, 197.234.240.0/22, 198.41.128.0/17, 162.158.0.0/15, 104.16.0.0/13, 104.24.0.0/14, 172.64.0.0/13, 131.0.72.0/22 }
    }

    set cloudflare_v6 {
        type ipv6_addr
        flags interval
        elements = { 2400:cb00::/32, 2606:4700::/32, 2803:f800::/32, 2405:b500::/32, 2405:8100::/32, 2a06:98c0::/29, 2c0f:f248::/32 }
    }

    chain input {
        type filter hook input priority filter; policy drop;

        iifname "lo" accept
        ct state invalid drop
        ct state established,related accept

        ip protocol icmp accept
        meta l4proto ipv6-icmp accept
        udp sport 67 udp dport 68 accept
        ip6 saddr fe80::/10 udp sport 547 udp dport 546 accept

        tcp dport 22 ct state new meter ssh4_rate { ip saddr limit rate 15/minute burst 20 packets } accept
        tcp dport 22 ct state new meter ssh6_rate { ip6 saddr limit rate 15/minute burst 20 packets } accept
        ip saddr @cloudflare_v4 tcp dport { 80, 443 } ct state new accept
        ip6 saddr @cloudflare_v6 tcp dport { 80, 443 } ct state new accept

        limit rate 5/second burst 20 packets log prefix "nft-input-drop " flags all counter drop
    }

    chain forward {
        type filter hook forward priority filter; policy drop;
    }

    chain output {
        type filter hook output priority filter; policy accept;
    }
}
