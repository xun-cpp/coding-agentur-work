name: Security gates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, test, audit and scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout immutable revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Install locked dependencies
        run: |
          npm ci --prefix backend --ignore-scripts
          npm rebuild --prefix backend argon2 esbuild
          npm ci --prefix frontend --ignore-scripts
          npm rebuild --prefix frontend esbuild
      - name: Check locked dependencies against OSV
        run: node tools/osv-scan.mjs
      - name: Backend verification
        run: |
          npm run build --prefix backend
          npm test --prefix backend
          npm audit --prefix backend --audit-level=moderate
      - name: Frontend verification
        env:
          PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
        run: |
          npm test --prefix frontend
          npm run build --prefix frontend
          npm audit --prefix frontend --audit-level=moderate
      - name: Repository security policy
        run: node tools/security-scan.mjs
      - name: Produce software bills of materials
        run: |
          mkdir -p security-artifacts
          npm sbom --prefix backend --omit=dev --sbom-format=cyclonedx > security-artifacts/backend.cdx.json
          npm sbom --prefix frontend --omit=dev --sbom-format=cyclonedx > security-artifacts/frontend.cdx.json
      - name: Upload SBOMs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cyclonedx-sboms
          path: security-artifacts/*.json
          retention-days: 14

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        with:
          fail-on-severity: moderate

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@bb16b9baa2ec4010b29f5c606d57d01190139edd
        with:
          languages: javascript-typescript
          build-mode: none
      - name: Analyze
        uses: github/codeql-action/analyze@bb16b9baa2ec4010b29f5c606d57d01190139edd
        with:
          category: /language:javascript-typescript
